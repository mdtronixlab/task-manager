<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Organisation Task Manager" />
    <title>Organisation Task Manager</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Runs before first paint so there's no flash of the wrong theme —
      // a useEffect in ThemeContext.jsx would read localStorage too late,
      // after dark (the :root default) has already painted. Keep the
      // storage key in sync with ThemeContext.jsx's STORAGE_KEY.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('otm-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {
          // localStorage unavailable (private browsing etc.) — dark default stands.
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
