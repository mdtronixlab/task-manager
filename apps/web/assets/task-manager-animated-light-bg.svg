<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 1000"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <filter id="blur90" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="blur65" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>

    <radialGradient id="blue">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#60a5fa" stop-opacity=".16"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violet">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#a78bfa" stop-opacity=".12"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyan">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".22"/>
      <stop offset=".58" stop-color="#67e8f9" stop-opacity=".11"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="green">
      <stop offset="0" stop-color="#10b981" stop-opacity=".18"/>
      <stop offset=".58" stop-color="#6ee7b7" stop-opacity=".09"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#94a3b8" opacity=".13"/>
    </pattern>
  </defs>

  <!-- Clean canvas -->
  <rect width="1600" height="1000" fill="url(#base)"/>

  <!-- Very subtle productivity-style dot fields -->
  <rect x="0" y="0" width="430" height="310" fill="url(#dots)" opacity=".32"/>
  <rect x="1170" y="700" width="430" height="300" fill="url(#dots)" opacity=".25"/>

  <!-- Large slow-moving ambient blobs -->
  <g filter="url(#blur90)">
    <ellipse cx="120" cy="90" rx="430" ry="290" fill="url(#blue)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 75 35; 115 90; 20 120; 0 0"
        dur="21s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="430;480;410;450;430"
        dur="21s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1480" cy="170" rx="390" ry="285" fill="url(#violet)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-60 35;-100 100;-25 70;0 0"
        dur="25s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="285;330;265;300;285"
        dur="25s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="170" cy="900" rx="400" ry="270" fill="url(#cyan)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;80 -45;115 -95;25 -50;0 0"
        dur="23s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1450" cy="880" rx="420" ry="260" fill="url(#green)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-80 -35;-120 -95;-30 -70;0 0"
        dur="27s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Secondary drifting blobs -->
  <g filter="url(#blur65)">
    <circle cx="530" cy="120" r="130" fill="url(#cyan)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;90 55;-20 120;-90 20;0 0"
        dur="17s" repeatCount="indefinite"/>
      <animate attributeName="r" values="130;155;115;145;130"
        dur="17s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1090" cy="880" r="145" fill="url(#blue)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-85 30;40 -80;110 -20;0 0"
        dur="19s" repeatCount="indefinite"/>
      <animate attributeName="r" values="145;175;120;155;145"
        dur="19s" repeatCount="indefinite"/>
    </circle>

    <circle cx="830" cy="160" r="90" fill="url(#violet)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-65 45;70 100;35 -10;0 0"
        dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtle flowing lines, suggesting task progress -->
  <g fill="none" stroke="#64748b" stroke-opacity=".08" stroke-width="2">
    <path d="M-100 720 C250 560 380 860 700 700 S1190 520 1700 650">
      <animate attributeName="d"
        values="
        M-100 720 C250 560 380 860 700 700 S1190 520 1700 650;
        M-100 690 C250 620 420 820 710 730 S1220 540 1700 620;
        M-100 720 C250 560 380 860 700 700 S1190 520 1700 650"
        dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M-100 750 C260 590 400 890 720 730 S1200 560 1700 680"
          transform="translate(0 28)"/>
  </g>

  <!-- Tiny floating status dots -->
  <g>
    <circle cx="420" cy="610" r="4" fill="#3b82f6" opacity=".22">
      <animate attributeName="cy" values="610;575;610" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".10;.30;.10" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1210" cy="400" r="4" fill="#8b5cf6" opacity=".20">
      <animate attributeName="cy" values="400;365;400" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".08;.28;.08" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="820" r="3" fill="#06b6d4" opacity=".18">
      <animate attributeName="cy" values="820;790;820" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
