<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur80" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur55" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

    <radialGradient id="blobBlue">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".42"/>
      <stop offset=".65" stop-color="#93c5fd" stop-opacity=".18"/>
      <stop offset="1" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".34"/>
      <stop offset=".65" stop-color="#c4b5fd" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ddd6fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset=".65" stop-color="#67e8f9" stop-opacity=".12"/>
      <stop offset="1" stop-color="#cffafe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobMint">
      <stop offset="0" stop-color="#34d399" stop-opacity=".24"/>
      <stop offset=".65" stop-color="#6ee7b7" stop-opacity=".10"/>
      <stop offset="1" stop-color="#d1fae5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Clean light-theme base -->
  <rect width="1920" height="1080" fill="url(#wash)"/>

  <!-- Soft animated blobs -->
  <g filter="url(#blur80)">
    <ellipse cx="250" cy="180" rx="430" ry="300" fill="url(#blobBlue)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 90 55; 20 120; -70 45; 0 0"
        dur="18s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1680" cy="210" rx="420" ry="310" fill="url(#blobPurple)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-80 65;-20 130;75 35;0 0"
        dur="22s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="430" cy="930" rx="460" ry="300" fill="url(#blobCyan)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;110 -60;45 -130;-80 -40;0 0"
        dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1540" cy="900" rx="480" ry="300" fill="url(#blobMint)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-100 -50;-30 -120;90 -30;0 0"
        dur="24s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Smaller, slightly sharper floating blobs -->
  <g filter="url(#blur55)">
    <circle cx="970" cy="190" r="180" fill="url(#blobCyan)">
      <animate attributeName="r" values="180;230;190;150;180" dur="13s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;100 50;-50 110;-100 20;0 0"
        dur="17s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1000" cy="850" r="170" fill="url(#blobPurple)">
      <animate attributeName="r" values="170;210;155;190;170" dur="15s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-90 50;40 120;100 10;0 0"
        dur="19s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Very subtle decorative rings -->
  <g fill="none" stroke="#93c5fd" stroke-opacity=".20" stroke-width="2">
    <circle cx="1550" cy="540" r="115">
      <animate attributeName="r" values="115;145;115" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".12;.28;.12" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="650" r="85">
      <animate attributeName="r" values="85;110;85" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".10;.22;.10" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
