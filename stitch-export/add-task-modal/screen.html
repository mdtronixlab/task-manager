<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Task - Task Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "surface-container": "#1d1f29",
                        "on-primary-fixed": "#001452",
                        "on-tertiary": "#611300",
                        "surface-variant": "#32343f",
                        "inverse-primary": "#004ced",
                        "success": "#10B981",
                        "surface-container-highest": "#32343f",
                        "tertiary-fixed-dim": "#ffb4a1",
                        "on-tertiary-fixed-variant": "#891e00",
                        "on-tertiary-fixed": "#3c0800",
                        "on-secondary-container": "#a9bad3",
                        "on-primary-fixed-variant": "#0038b6",
                        "on-secondary": "#213145",
                        "surface-bright": "#373943",
                        "primary-container": "#0052ff",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "accent-teal": "#2DD4BF",
                        "warning": "#F59E0B",
                        "primary-fixed-dim": "#b7c4ff",
                        "on-primary": "#002682",
                        "tertiary-fixed": "#ffdbd2",
                        "inverse-on-surface": "#2e303a",
                        "on-secondary-fixed": "#0b1c30",
                        "on-background": "#e1e1ef",
                        "outline": "#8d90a2",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-surface": "#e1e1ef",
                        "background": "#020617",
                        "primary": "#b7c4ff",
                        "surface-tint": "#b7c4ff",
                        "primary-fixed": "#dde1ff",
                        "outline-variant": "#434656",
                        "on-tertiary-container": "#ffddd5",
                        "secondary": "#b7c8e1",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-primary-container": "#dfe3ff",
                        "surface-container-high": "#282934",
                        "tertiary-container": "#bf3003",
                        "on-surface-variant": "#c3c5d9",
                        "surface-container-low": "#191b25",
                        "secondary-container": "#3a4a5f",
                        "error": "#EF4444",
                        "inverse-surface": "#e1e1ef",
                        "surface-container-lowest": "#0c0e17",
                        "tertiary": "#ffb4a1",
                        "surface": "#0F172A",
                        "surface-dim": "#11131c",
                        "secondary-fixed": "#d3e4fe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "space-xs": "4px",
                        "unit": "4px",
                        "gutter": "24px",
                        "margin-desktop": "48px",

                    "fontFamily": {

                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]

        }

<style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Custom Scrollbar for Textarea */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #434656; /* outline-variant */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8d90a2; /* outline */
        }
        
        .form-input-glow:focus {
            box-shadow: 0 0 0 2px rgba(0, 82, 255, 0.2); /* primary-container with opacity */
            border-color: #0052ff;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex items-center justify-center p-gutter relative overflow-hidden">
<!-- Ambient Background Decoration (Subtle) -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-primary-container opacity-5 blur-[120px]"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full bg-accent-teal opacity-5 blur-[100px]"></div>
</div>
<!-- Modal Container -->
<!-- Note: In a real app, this would be toggled via JS, overlaying the main app. Here it's the primary visual. -->
<div class="w-full max-w-2xl relative z-10 glass-panel rounded-xl shadow-[0_32px_64px_rgba(2,6,23,0.5)] flex flex-col">
<!-- Modal Header -->
<div class="flex items-center justify-between p-space-lg border-b border-white/5">
<h2 class="font-headline-md text-headline-md text-on-surface">Create New Task</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface transition-colors p-unit rounded-full hover:bg-surface-container-high" type="button">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body / Form -->
<form class="p-space-lg flex flex-col gap-space-lg">
<!-- Task Title -->
<div class="flex flex-col gap-space-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="task-title">Task Title</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface font-body-md text-body-md py-3 px-4 placeholder-on-surface-variant/50 focus:outline-none transition-all duration-200 form-input-glow" id="task-title" name="task-title" placeholder="E.g., Q3 Financial Review" required="" type="text"/>
</div>
<!-- Description -->
<div class="flex flex-col gap-space-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="task-desc">Description</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface font-body-md text-body-md py-3 px-4 placeholder-on-surface-variant/50 focus:outline-none transition-all duration-200 form-input-glow resize-none" id="task-desc" name="task-desc" placeholder="Provide detailed context or specific requirements..." rows="4"></textarea>
</div>
<!-- Grid for Category and Priority -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-space-lg">
<!-- Category Dropdown -->
<div class="flex flex-col gap-space-sm relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="task-category">Category</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface font-body-md text-body-md py-3 pl-4 pr-10 appearance-none focus:outline-none transition-all duration-200 form-input-glow cursor-pointer" id="task-category" name="task-category">
<option class="text-on-surface-variant/50" disabled="" selected="" value="">Select Category</option>
<option value="research">Research &amp; Analysis</option>
<option value="development">Development</option>
<option value="design">Design</option>
<option value="administrative">Administrative</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Priority Dropdown -->
<div class="flex flex-col gap-space-sm relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="task-priority">Priority Level</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant rounded text-on-surface font-body-md text-body-md py-3 pl-4 pr-10 appearance-none focus:outline-none transition-all duration-200 form-input-glow cursor-pointer" id="task-priority" name="task-priority">
<option value="low">Low</option>
<option selected="" value="medium">Medium</option>
<option value="high">High</option>
<option value="urgent">Urgent</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</div>
</form>
<!-- Modal Footer / Actions -->
<div class="p-space-lg border-t border-white/5 flex justify-end gap-space-md bg-surface-container/30 rounded-b-xl">
<button class="px-6 py-2 rounded border border-white/10 text-on-surface font-body-md text-body-md hover:bg-surface-container-high hover:border-outline-variant transition-all duration-200" type="button">
                Cancel
            </button>
<button class="px-6 py-2 rounded bg-primary-container text-white font-body-md text-body-md hover:brightness-110 shadow-[0_4px_12px_rgba(0,82,255,0.3)] transition-all duration-200 flex items-center gap-space-sm" type="submit">
<span class="material-symbols-outlined text-[20px]" data-icon="add_task">add_task</span>
                Create Task
            </button>
</div>
</div>
</body></html>
