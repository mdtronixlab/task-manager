name: Publish Docker images

# Builds & pushes both apps' images to GitHub Container Registry (public,
# even though this repo is private — see docker-compose.casaos.yml's
# top-of-file note) on every push to main, so a CasaOS "Custom Install →
# paste YAML" install (which pulls pre-built images, not this source) never
# goes stale. Also runnable by hand for a one-off rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/task-manager-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/task-manager-web

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GITHUB_TOKEN push to this repo's own GHCR packages — no extra
      # PAT/secret needed.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` for CasaOS's paste-YAML install (docker-compose.casaos.yml
      # pins to it); the commit SHA tag exists so a specific build can still
      # be pulled/rolled back to later even after `latest` moves on.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=
            VITE_APP_NAME=Organisation Task Manager
            VITE_APP_ENV=production
            VITE_FIREBASE_API_KEY=AIzaSyCZiufKT1XnTGG9LT5sUui2Sc2wN2oC_9Y
            VITE_FIREBASE_AUTH_DOMAIN=task-manager-app-2d85c.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID=task-manager-app-2d85c
            VITE_FIREBASE_APP_ID=1:571826951996:web:6820c80916c66010c03039
